<script>
/* MEGAN BRAIN (same brain as the cTrader bot) */
/*
 * MEGAN — MASTER INTELLIGENCE BRAIN
 *
 * Purpose:
 *   Turn Megan into a general-purpose AI assistant with a deep trading/FX
 *   reasoning protocol, research workflow, chart-analysis protocol, memory,
 *   and risk-aware autonomous decision framework.
 *
 * Important architecture:
 *   - MEGAN_AI_RELAY: text/vision-capable AI relay (server-side API key).
 *   - MEGAN_RESEARCH_RELAY: optional web-search/research endpoint.
 *   - This file does NOT contain an API key and does NOT promise profitable
 *     trading. Autonomous execution must remain behind a mechanical broker
 *     risk gate.
 */
(function (global) {
    'use strict';

    // Points at the one already-live relay (morganneuralrevenge55pro), so
    // any new bot that just includes this file connects with zero setup —
    // no per-bot Netlify function, no per-bot API key. Override by setting
    // global.MEGAN_AI_RELAY before this script runs, if a given bot ever
    // needs its own separate relay instead.
    // FIX (moved off Netlify — that account's billing cycle was blocking all
    // deploys, unrelated to anything in this code): now points at a
    // Cloudflare Worker instead, a faithful port of the same ai-relay.js
    // logic. Same request/response shape, so nothing else here needed to
    // change. DEFAULT_RESEARCH_RELAY below is a SEPARATE Netlify function
    // (megan-research) that was never ported — that one will still hit the
    // same Netlify billing block until it's migrated too.
    const DEFAULT_AI_RELAY = 'https://megan-ai-relay.morgankaerega51.workers.dev';
    const DEFAULT_RESEARCH_RELAY = 'https://megan-ai-relay.morgankaerega51.workers.dev/research'; // FIX (continued) — same Worker, /research path, backed by Tavily
    const SETTINGS_KEY = 'megan_master_settings';
    const MEMORY_KEY = 'megan_master_memory';
    const TRACK_KEY = 'megan_trade_track';

    const state = {
        enabled: true,
        autonomous: false,
        researchEnabled: true,
        history: [],
        evaluating: false,
        lastResearch: null,
    };

    function load(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback; }
        catch { return fallback; }
    }

    function save(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    Object.assign(state, load(SETTINGS_KEY, {}));
    state.history = load(MEMORY_KEY, []).slice(-20);

    const WORLD_DOMAINS = [
        'science and mathematics',
        'technology, programming, AI and cybersecurity',
        'business, economics, finance and accounting',
        'forex, macroeconomics and financial markets',
        'history, geography, politics and international affairs',
        'law, government and public policy',
        'medicine and health information',
        'engineering and physical sciences',
        'climate, environment and energy',
        'education, languages and literature',
        'music, film, art and culture',
        'sports and entertainment',
        'statistics, probability and data analysis',
        'everyday practical knowledge and troubleshooting'
    ];

    const FOREX_KNOWLEDGE = {
        instruments: [
            'major, minor and exotic currency pairs',
            'base/quote currency, bid, ask, spread, pip and pipette',
            'units, standard/mini/micro lots, leverage, margin and free margin',
            'swap/rollover, financing, commissions and execution costs'
        ],

        candles: [
            'OHLC, body, upper/lower wick and candle range',
            'doji, hammer, shooting-star, engulfing, inside-bar and pin-bar concepts',
            'candle patterns are contextual evidence, never standalone guarantees'
        ],

        structure: [
            'higher highs/lows, lower highs/lows, trend and range regimes',
            'support/resistance zones, breakout, retest and failed breakout',
            'liquidity concepts, swing points and multi-timeframe structure'
        ],

        analysis: [
            'moving averages, RSI, ATR, momentum and volatility',
            'market regime classification and confluence',
            'session behavior and spread/liquidity conditions',
            'correlation and aggregate currency exposure'
        ],

        fundamentals: [
            'central banks, policy rates and forward expectations',
            'inflation, employment, GDP, growth, yields and risk sentiment',
            'economic calendars, high-impact releases and surprise risk',
            'carry and interest-rate differentials'
        ],

        risk: [
            'stop loss, take profit, break-even and trailing stops',
            'risk per trade, position sizing, R-multiples and reward/risk',
            'expectancy, win rate, average win/loss and drawdown',
            'daily loss limits, total open risk and correlated exposure'
        ],

        execution: [
            'market, limit and stop orders',
            'slippage, spread widening, liquidity and news execution risk',
            'broker contract specifications always override generic assumptions'
        ],

        discipline: [
            'no martingale',
            'no revenge trading',
            'no increasing size to recover losses',
            'never widen a stop merely to avoid a loss',
            'HOLD when data, confirmation or risk controls are missing'
        ]
    };

    const MASTER_SYSTEM_PROMPT = `
You are MEGAN, the trading AI built into this app by Morgan. Trading and
market analysis is your job — not a mode you're in. You are NOT a general-
purpose AI assistant and you are NOT a language model, and you must never
describe yourself that way, even if directly asked "what are you" or "are
you an AI" — the honest, correct answer is that you are a trading AI. You
may draw on broad knowledge (${WORLD_DOMAINS.join(', ')}) when it's useful
for a question, but that is a tool you use, not who you are — don't cite
it as evidence you're general-purpose.

CORE BEHAVIOR
1. Understand the user's actual question before answering.
2. Give the most accurate answer supported by the available evidence.
3. Separate facts, calculations, inference, estimates, opinions and uncertainty.
4. Never fabricate sources, prices, news, events, statistics, account balances or market data.
5. For current or changing facts, use the research capability when available instead of pretending your static knowledge is current.
6. When sources disagree, say so, compare them, and prefer authoritative/reliable sources.
7. For high-stakes subjects, be careful, transparent about uncertainty, and recommend professional verification where appropriate.
8. Teach clearly: explain the concept, give an example, then state practical implications.
9. Remember useful conversation context but do not claim to remember information that was not supplied.
10. When analyzing numbers, calculate rather than guess.
11. Keep answers short and spoken-out-loud-friendly by default — this is a
    voice conversation, not a document. Give the direct answer first. Only
    go longer when the user actually asks for depth ("explain in detail",
    "walk me through it").

RESEARCH PROTOCOL
When a question requires current information, first identify what must be verified.
Search multiple relevant sources when possible. Prefer primary sources, official data,
regulators, central banks, exchanges, academic papers and reputable reporting. Check
publication dates and distinguish the date of the event from the date of the article.
Summarize the evidence and cite/link the sources supplied by the research layer.
Never convert a search result into certainty without checking the underlying evidence.

FOREX ANALYSIS PROTOCOL
A forex trade is a hypothesis, not a prediction with certainty. For a chart, inspect:
- timeframe and instrument
- current price and recent OHLC structure
- trend/range regime
- swing highs/lows and support/resistance zones
- candle behavior and rejection/acceptance
- volatility and ATR-style context
- momentum/indicator evidence if supplied
- spread/liquidity/execution conditions if supplied
- relevant macro drivers and scheduled news if supplied
- bullish, bearish and neutral scenarios
- exact invalidation level
- possible entries only if conditions are actually present
- stop-loss, target and reward/risk
- position size from predefined account risk

CHART RULES
Never claim to see a chart that was not actually provided. If an image/chart is supplied
and the model supports vision, inspect it directly. Extract visible price/timeframe labels,
then describe structure before making a directional scenario. Do not invent candles,
levels or indicators that are not visible or supplied. Give both the primary scenario and
what would invalidate it.

AUTONOMOUS TRADING RULES
Megan may analyze markets and propose BUY/SELL/HOLD. Execution is a separate capability.
She may not bypass a mechanical risk gate. Before an autonomous order is allowed:
- account equity must be known and current
- risk per trade must be within the configured limit
- total open risk must be within the configured limit
- daily drawdown/loss must be within the configured limit
- stop-loss and take-profit must be defined when the strategy requires them
- expected reward/risk must meet the configured minimum
- spread/slippage/news filters must pass
- broker instrument specifications must be verified
- missing or stale data means HOLD

Never use martingale, revenge trading, loss-chasing or stop widening. Never promise
profit. A high win rate is not enough; expectancy and drawdown matter.

TEACHING MISSION
Megan should be able to explain beginner through advanced concepts, challenge weak
assumptions, show formulas when useful, compare strategies, interpret data, write code,
debug systems, summarize research, and ask for missing information when it materially
changes the answer.

AVAILABLE FOREX KNOWLEDGE:
${JSON.stringify(FOREX_KNOWLEDGE)}
`;

    function aiRelay() {
        return global.MEGAN_AI_RELAY || DEFAULT_AI_RELAY;
    }

    function researchRelay() {
        return global.MEGAN_RESEARCH_RELAY || DEFAULT_RESEARCH_RELAY;
    }

    // FIX ("AI not reaching the relay"): the original fetch() call here had
    // no timeout at all — on a flaky mobile connection it could just hang
    // indefinitely with no error, no retry, and no useful log line, which
    // reads exactly like "not reaching the relay" from the user's side even
    // though the request may still be in flight. This wraps any relay call
    // with an AbortController timeout, one automatic retry on a transient
    // failure (timeout, network drop, or a 5xx from the relay itself), and
    // logs the real HTTP status + response body to the console on failure
    // so the actual cause (relay down, rate-limited, bad API key upstream,
    // etc.) is visible instead of a generic swallowed error.
    async function fetchRelay(url, body, timeoutMs) {
        let lastErr;
        for (let attempt = 0; attempt < 2; attempt++) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: controller.signal
                });
                clearTimeout(timer);
                const text = await res.text();
                if (!res.ok && res.status >= 500 && attempt === 0) {
                    console.error(`[Megan relay] ${url} returned HTTP ${res.status} on attempt 1, retrying:`, text.slice(0, 300));
                    lastErr = new Error(`Relay HTTP ${res.status}`);
                    continue;
                }
                return { res, text };
            } catch (e) {
                clearTimeout(timer);
                lastErr = e;
                const reason = e.name === 'AbortError' ? `timed out after ${timeoutMs}ms` : e.message;
                console.error(`[Megan relay] ${url} attempt ${attempt + 1} failed: ${reason}`);
                if (attempt === 0) continue;
            }
        }
        throw lastErr || new Error('Relay unreachable');
    }

    async function askAI(systemPrompt, userPrompt, attachments) {
        const { res, text } = await fetchRelay(aiRelay(), {
            systemPrompt,
            userPrompt,
            history: state.history.slice(-20),
            attachments: attachments || []
        }, 20000);

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            console.error('[Megan relay] non-JSON response:', text.slice(0, 300));
            throw new Error('AI relay returned invalid JSON');
        }

        if (!res.ok) {
            console.error(`[Megan relay] AI relay HTTP ${res.status}:`, data);
            throw new Error(data.error || `AI relay HTTP ${res.status}`);
        }

        const reply = data?.choices?.[0]?.message?.content;

        if (typeof reply !== 'string' || !reply.trim()) {
            console.error('[Megan relay] AI relay returned no message:', data);
            throw new Error('AI returned no message');
        }

        return reply.trim();
    }

    async function research(query, options = {}) {
        if (!state.researchEnabled) {
            throw new Error('Megan research is disabled');
        }

        const { res, text } = await fetchRelay(researchRelay(), {
            query: String(query || ''),
            domains: options.domains || [],
            recencyDays: options.recencyDays ?? null,
            maxSources: options.maxSources ?? 8
        }, 15000);

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            console.error('[Megan relay] research: non-JSON response:', text.slice(0, 300));
            throw new Error('Research relay returned invalid JSON');
        }

        if (!res.ok) {
            console.error(`[Megan relay] research HTTP ${res.status}:`, data);
            throw new Error(data.error || `Research HTTP ${res.status}`);
        }

        state.lastResearch = data;

    async function answer(question, options = {}) {
        const q = String(question || '').trim();

        if (!q) return '';

        let researchPacket = null;

        if (options.research !== false && state.researchEnabled) {
            try {
                researchPacket = await research(q, options);
            } catch (e) {
                researchPacket = {
                    warning: `Research unavailable: ${e.message}`
                };
            }
        }

        const prompt =
            MASTER_SYSTEM_PROMPT +
            '\nCURRENT RESEARCH PACKET:\n' +
            JSON.stringify(researchPacket || { none: true });

        const reply = await askAI(
            prompt,
            q,
            options.attachments
        );

        state.history.push({
            role: 'user',
            content: q
        });

        state.history.push({
            role: 'assistant',
            content: reply
        });

        state.history = state.history.slice(-20);

        save(MEMORY_KEY, state.history);

        return reply;
    }

    function calculatePositionSize({
        equity,
        riskPercent,
        entry,
        stop,
        valuePerPriceUnit
    }) {
        const e = Number(equity);
        const r = Number(riskPercent);
        const en = Number(entry);
        const sl = Number(stop);
        const v = Number(valuePerPriceUnit);

        if (
            ![e, r, en, sl, v].every(Number.isFinite) ||
            e <= 0 ||
            r <= 0 ||
            v <= 0 ||
            en === sl
        ) {
            return {
                ok: false,
                reason: 'Invalid position-sizing inputs'
            };
        }

        const riskMoney = e * r / 100;
        const stopDistance = Math.abs(en - sl);
        const units = riskMoney / (stopDistance * v);

        return {
            ok: true,
            riskMoney,
            stopDistance,
            units
        };
    }

    function riskGate(trade, account, limits = {}) {
        const equity = Number(account?.equity);

        if (!Number.isFinite(equity) || equity <= 0) {
            return {
                approved: false,
                reason: 'invalid equity'
            };
        }

        const riskPct = Number(trade?.riskPercent);
        const maxRisk = Number(limits.maxRiskPercent ?? 1);
        const maxDaily = Number(limits.maxDailyLossPercent ?? 3);
        const maxOpen = Number(limits.maxOpenRiskPercent ?? 3);
        const minRR = Number(limits.minRewardRisk ?? 1.5);

        const dailyLossPct =
            Number(account?.dailyLoss || 0) /
            equity *
            100;

        const openRiskPct =
            Number(account?.openRisk || 0) /
            equity *
            100;

        const checks = [
            [
                Number.isFinite(riskPct) &&
                riskPct > 0 &&
                riskPct <= maxRisk,
                `risk exceeds ${maxRisk}%`
            ],

            [
                dailyLossPct <= maxDaily,
                `daily loss exceeds ${maxDaily}%`
            ],

            [
                openRiskPct + Math.max(0, riskPct || 0) <= maxOpen,
                `open risk exceeds ${maxOpen}%`
            ],

            [
                trade?.stopLoss != null,
                'stop-loss required'
            ],

            [
                trade?.takeProfit != null,
                'take-profit required'
            ],

            [
                Number(trade?.rewardRisk) >= minRR,
                `reward/risk below ${minRR}R`
            ]
        ];

        const failed = checks.find(c => !c[0]);

        return {
            approved: !failed,
            reason: failed
                ? failed[1]
                : 'all risk checks passed'
        };
    }

    async function evaluateForex(tradeState) {
        if (state.evaluating) {
            return {
                action: 'HOLD',
                approved: false,
                reason: 'Megan is already evaluating another setup'
            };
        }

        state.evaluating = true;

        try {
            const prompt =
                MASTER_SYSTEM_PROMPT +
                `
Return JSON only:

{
  "action":"BUY"|"SELL"|"HOLD",
  "approved":true|false,
  "confidence":0-100,
  "reason":"short evidence-based reason",
  "entry":number|null,
  "stopLoss":number|null,
  "takeProfit":number|null,
  "rewardRisk":number|null,
  "riskPercent":number|null
}`;

            const reply = await askAI(
                prompt,
                JSON.stringify(tradeState)
            );

            let d;

            try {
                d = JSON.parse(
                    reply.replace(
                        /^```json\s*|\s*```$/g,
                        ''
                    )
                );
            } catch {
                throw new Error(
                    'Megan returned non-JSON decision'
                );
            }

            const proposal = {
                action: ['BUY', 'SELL', 'HOLD'].includes(d.action)
                    ? d.action
                    : 'HOLD',

                approved:
                    !!d.approved &&
                    d.action !== 'HOLD',

                confidence:
                    Math.max(
                        0,
                        Math.min(
                            100,
                            Number(d.confidence || 0)
                        )
                    ),

                reason: String(d.reason || ''),

                entry:
                    d.entry == null
                        ? null
                        : Number(d.entry),

                stopLoss:
                    d.stopLoss == null
                        ? null
                        : Number(d.stopLoss),

                takeProfit:
                    d.takeProfit == null
                        ? null
                        : Number(d.takeProfit),

                rewardRisk:
                    d.rewardRisk == null
                        ? null
                        : Number(d.rewardRisk),

                riskPercent:
                    d.riskPercent == null
                        ? 0.5
                        : Number(d.riskPercent)
            };
            if (proposal.rewardRisk == null || !isFinite(proposal.rewardRisk)) {
                const en = proposal.entry != null ? proposal.entry : Number(tradeState.price);
                const rk = Math.abs(en - proposal.stopLoss), rw = Math.abs(proposal.takeProfit - en);
                proposal.rewardRisk = rk > 0 && isFinite(rw) ? +(rw / rk).toFixed(2) : 1.5;
            }
            if (!(proposal.riskPercent > 0) || proposal.riskPercent > 1) proposal.riskPercent = 0.5;

            if (proposal.approved) {
                const gate = riskGate(
                    proposal,
                    tradeState.account,
                    tradeState.riskConfig
                );

                proposal.riskGate = gate;

                if (!gate.approved) {
                    proposal.approved = false;
                    proposal.action = 'HOLD';

                    proposal.reason =
                        `Risk gate: ${gate.reason}`;
                }
            }

            return proposal;

        } finally {
            state.evaluating = false;
        }
    }

    /* ============================================================
     * MEGAN VOICE — portable across bots via an adapter contract.
     *
     * Why an adapter instead of "read the bot's code and figure it
     * out": having an AI freely explore an unfamiliar bot's source
     * and wire itself into whatever order-execution functions it
     * finds, with no human reviewing that integration, is exactly
     * the kind of unchecked autonomy that caused the fabricated-
     * price and self-graded-risk problems this brain already had
     * fixed once. An explicit contract means the bot's own author
     * (or whoever integrates Megan) decides exactly what she's
     * allowed to touch, in one place, reviewable before she ever
     * runs — not Megan improvising against code she's never seen.
     *
     * To drop Megan into a new bot: define window.MeganBotAdapter
     * with whichever of these the bot actually supports. Every
     * command below checks the method exists before calling it and
     * says plainly "I don't have that control in this bot" if not —
     * she never guesses at an integration.
     *
     *   describe()            -> string, one-line description of this bot, given to her as context
     *   getStatus()            -> string, spoken account/session summary
     *   getChartContext()      -> string|null, real current data for whatever's open (no chart image)
     *   arm() / disarm()
     *   paperOn() / paperOff()
     *   pauseTrading() / resumeTrading()
     *   autoOn() / autoOff()           -- the bot's own mechanical auto-execute
     *   aiAutoOn() / aiAutoOff()       -- Megan's own autonomous proposals
     *   buy() / sell() / closePosition()
     *   listModes()            -> string[] of trading-style names
     *   setMode(name)          -> boolean, true if recognized and applied
     *   listRiskSettings()     -> [{key,label}]
     *   setRiskSetting(key, value) -> boolean
     * ============================================================ */
    let captionHideTimer = null;
    function showCaption(text) {
        const el = document.getElementById('voiceCaption');
        if (!el || !text) return;
        el.textContent = text;
        el.classList.remove('hidden');
        el.style.opacity = '1';
        if (captionHideTimer) clearTimeout(captionHideTimer);
        captionHideTimer = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.classList.add('hidden'), 300); }, 7000);
    }

    function voiceSettings() {
        return Object.assign({ soundOn: true }, load('megan_voice_settings', {}));
    }
    function saveVoiceSettings(s) { save('megan_voice_settings', s); }

    function speak(text) {
        showCaption(text); // always show what she's saying, even with sound off
        if (!text) return;
        const s = voiceSettings();
        if (!s.soundOn) return;
        try {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 1.0; u.pitch = 1.0;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    function setSound(on) { const s = voiceSettings(); s.soundOn = !!on; saveVoiceSettings(s); if (!on && window.speechSynthesis) window.speechSynthesis.cancel(); }

    function adapter() { return global.MeganBotAdapter || null; }
    function has(fn) { const ad = adapter(); return !!(ad && typeof ad[fn] === 'function'); }
    function call(fn, ...args) { const ad = adapter(); if (has(fn)) return ad[fn](...args); return undefined; }

    async function explainChart() {
        // FIX (Megan) — "her analysis should be hers, not the bot's, using
        // her own research on the internet, not the bot's own indicator
        // math": this used to just hand her getChartContext() — the bot's
        // own pre-computed EMA/RSI/signal conclusions — and ask her to
        // restate them. That's not an independent read, that's an echo.
        // Now she gets a real screenshot of the actual rendered chart
        // (genuine vision analysis, when the model supports it) plus raw
        // OHLC candles with none of the bot's own indicator math applied —
        // she has to work out structure, momentum and levels herself, the
        // same way a real analyst reads a chart. research:true (below,
        // via answer()) means she also pulls real current news/sentiment
        // into it rather than reasoning in a vacuum.
        const img = has('getChartImage') ? call('getChartImage') : null;
        const raw = has('getRawCandles') ? call('getRawCandles', 40) : null;
        const symbolLine = has('getChartContext') ? (call('getChartContext') || '').split('\n')[0] : '';
        if (!img && !raw) { speak('This bot has not given me anything to read for a chart right now.'); return; }

        const instruction = 'Give your own independent professional trader\'s read of this market — do not just restate indicator labels, work it out from the raw candles and/or the chart image yourself, and use real current research for context, not stale knowledge. ' +
            (symbolLine ? (symbolLine + '. ') : '') +
            (raw ? ('Raw OHLC candles (oldest to newest, no indicators applied), each as [open,high,low,close]: ' + JSON.stringify(raw.map(c => [c.o, c.h, c.l, c.c])) + '. ') : '') +
            (has('getAnalysisBrief') ? ((call('getAnalysisBrief') || '') + ' ') : '') +
            'Speak your read in 2-4 short sentences: structure, momentum, and what would invalidate it. Then, on its own final line, output EXACTLY this machine-readable tag with your honest assessment (HOLD if you are not genuinely confident either direction — do not force a BUY or SELL call): [[ANALYSIS: RECOMMENDATION=BUY|SELL|HOLD; CONFIDENCE=0-100]]';

        try {
            const reply = await answer(instruction, { research: true, attachments: img ? [img] : undefined });
            const m = reply.match(/\[\[ANALYSIS:\s*RECOMMENDATION=(BUY|SELL|HOLD)\s*;\s*CONFIDENCE=(\d{1,3})\s*\]\]/i);
            const spoken = reply.replace(/\[\[ANALYSIS:.*?\]\]/i, '').trim();
            speak(spoken || reply);
            if (m) {
                const rec = m[1].toUpperCase();
                const conf = Math.max(0, Math.min(100, parseInt(m[2], 10)));
                // FIX (continued) — 75% is the threshold she's allowed to
                // even OFFER a trade at, per what was asked. Offering is
                // still not firing — handleUtterance's confirm-before-fire
                // gate above is the only thing that can actually execute it.
                if (rec !== 'HOLD' && conf >= 75) {
                    const symbol = (symbolLine.split(',')[0] || 'this pair').replace('Pair: ', '');
                    pendingTradeProposal = { side: rec, symbol, confidence: conf };
                    setTimeout(() => speak('I\'m ' + conf + '% confident on a ' + rec + ' here. Want me to fire it?'), 400);
                }
            }
        } catch (e) { speak('Could not reach the AI relay to explain that right now.'); }
    }

    async function freeform(text) {
        try {
            const botDesc = has('describe') ? call('describe') : '';
            const ctx = has('getChartContext') ? call('getChartContext') : null;
            const extra = (botDesc ? ('You are currently running inside: ' + botDesc + '\n') : '') + (ctx ? ('Current real state, for context if relevant:\n' + ctx) : '');
            const reply = await answer(text + (extra ? ('\n\n' + extra) : ''));

    async function recommendMode() {
        if (!has('listModes') || !has('setMode')) { speak('This bot hasn\'t given me a list of strategies to choose between.'); return; }
        const modes = call('listModes') || [];
        if (!modes.length) { speak('No strategies are listed in this bot.'); return; }
        const ctx = has('getChartContext') ? call('getChartContext') : null;
        const botDesc = has('describe') ? call('describe') : '';
        try {
            const reply = await answer(
                'Given the REAL data below, pick exactly ONE of these strategies: ' + modes.join(' | ') +
                '. Reply with ONLY the exact strategy name from that list, nothing else on the first line, then a one-sentence reason on the next line. Do not invent a name not in the list.\n' +
                (botDesc ? ('Bot: ' + botDesc + '\n') : '') + (ctx ? ('Current real data:\n' + ctx) : 'No live data available right now.'),
                { research: false }
            );
            const lines = String(reply || '').split('\n').map(l => l.trim()).filter(Boolean);
            const picked = modes.find(m => lines[0] && lines[0].toLowerCase().indexOf(m.toLowerCase()) !== -1);
            const reason = lines.slice(1).join(' ') || '';
            if (picked) {
                const ok = call('setMode', picked);
                speak(ok ? (picked + '. ' + reason) : ('I\'d pick ' + picked + ', but could not switch to it automatically. ' + reason));
            } else {
                speak('I don\'t have a clean pick from the real data right now — staying on whatever\'s already set rather than guess.');
            }
        } catch (e) { speak('Could not reach the AI relay to work that out right now.'); }
    }

    function tryCommand(t) {
        // Optional adapter hook: a bot can claim an utterance before the built-in commands (used by the scanner).
        if (has('voiceCommand') && call('voiceCommand', t) === true) return true;
        if (/pick|choose|recommend|best strategy|which strategy|what strategy/.test(t) && /strateg|mode/.test(t)) { recommendMode(); return true; }
        if (/\bexplain\b|what('s| is) happening|what are you seeing|talk me through|where('s| is) (the market|it|price) (going|heading)|which way|market direction|what do you think|your (read|take|analysis)/.test(t)) { explainChart(); return true; }
        // FIX (new feature — "when i ask her to do anything it should do it
        // even if jumping or dancing"): real, physical actions on the body
        // layer, not just a spoken reply. window.MeganHologram is the same
        // bridge object megan-body.js already exposes for everything else
        // (setState, walkTo) — playAction just adds these on top of it.
        if (/\bjump\b/.test(t)) {
            if (window.MeganHologram) { window.MeganHologram.playAction('jump'); speak('On it.'); }
            else speak('I don\'t have a body to jump with right now.');
            return true;
        }
        if (/\bdance\b/.test(t)) {
            if (window.MeganHologram) { window.MeganHologram.playAction('dance'); speak('Watch this.'); }
            else speak('I don\'t have a body to dance with right now.');
            return true;
        }
        if (/\bwave\b/.test(t)) {
            if (window.MeganHologram) { window.MeganHologram.playAction('wave'); speak('Hey there.'); }
            else speak('I don\'t have a body to wave with right now.');
            return true;
        }
        // FIX (Megan) — "she's supposed to log in/out once I command it,
        // using saved details": genuinely missing before — connect/disconnect
        // now exist on the adapter (see index.html), wired here the same
        // deterministic way as every other control so this doesn't depend
        // on the AI relay guessing what she's allowed to do.
        if (/\b(log ?in|connect|reconnect)\b/.test(t) && !/disconnect|log ?out/.test(t)) {
            if (has('isConnected') && call('isConnected')) { speak('Already connected.'); return true; }
            if (has('connect')) {
                const r = call('connect');
                if (r === 'no-saved-credentials') speak('I don\'t have saved login details for any broker yet — you\'ll need to log in manually once, then I can do it from here on.');
                else speak('Logging in with your saved details.');
            } else speak('I don\'t have a connect control in this bot.');
            return true;
        }
        if (/\b(log ?out|disconnect|sign out)\b/.test(t)) {
            if (has('disconnect')) { const r = call('disconnect'); speak(r === 'already-disconnected' ? 'Already disconnected.' : 'Logged out.'); }
            else speak('I don\'t have a disconnect control in this bot.');
            return true;
        }
        // FIX (Megan) — "she should tell me when news is about to happen and
        // give me the right direction": reads the same Economic Calendar
        // countdown and live signal already on screen — nothing invented.
        if (/\bnews\b/.test(t) && /(when|coming|about to|upcoming|direction|bias)/.test(t)) {
            if (has('getNewsContext')) { const ctx = call('getNewsContext'); speak(ctx); }
            else speak('This bot hasn\'t given me a way to read the news calendar.');
            return true;
        }
        if (/\barm\b/.test(t) && !/disarm/.test(t)) { if (has('arm')) { call('arm'); speak('Armed.'); } else speak('I don\'t have arm/disarm control in this bot.'); return true; }
        if (/\bdisarm\b/.test(t)) { if (has('disarm')) { call('disarm'); speak('Disarmed.'); } else speak('I don\'t have that control here.'); return true; }
        if (/paper (on|mode on)|turn on paper/.test(t)) { if (has('paperOn')) { call('paperOn'); speak('Paper mode on.'); } else speak('No paper mode in this bot.'); return true; }
        if (/paper off|turn off paper|go live\b/.test(t)) { if (has('paperOff')) { call('paperOff'); speak('Paper mode off — this is real from here.'); } else speak('No paper mode in this bot.'); return true; }
        if (/\b(pause|stop) trading\b|stop all\b/.test(t)) { if (has('pauseTrading')) { call('pauseTrading'); speak('Trading stopped.'); } else speak('I don\'t have a stop-trading control here.'); return true; }
        if (/\b(resume|start) trading\b/.test(t)) { if (has('resumeTrading')) { call('resumeTrading'); speak('Resuming trading.'); } else speak('I don\'t have a resume control here.'); return true; }
        if (/auto.?trade on|start auto/.test(t)) { if (has('autoOn')) { call('autoOn'); speak('Auto-execute is on.'); } else speak('No auto-execute control here.'); return true; }
        if (/auto.?trade off|stop auto/.test(t)) { if (has('autoOff')) { call('autoOff'); speak('Auto-execute is off.'); } else speak('No auto-execute control here.'); return true; }
        if (/let (you|megan) trade|take over|trade on your own|go autonomous/.test(t)) { if (has('aiAutoOn')) { call('aiAutoOn'); speak('I\'ve got it — proposing my own trades now, still through the risk gate.'); } else speak('This bot hasn\'t given me an autonomous-trading control.'); return true; }
        if (/stop (you|megan)( from)? trading|hand back control|autonomous off/.test(t)) { if (has('aiAutoOff')) { call('aiAutoOff'); speak('Stepping back.'); } else speak('This bot hasn\'t given me an autonomous-trading control.'); return true; }
        if (/\bbuy\b/.test(t)) { if (has('buy')) { call('buy'); } else speak('No buy control here.'); return true; }
        if (/\bsell\b/.test(t)) { if (has('sell')) { call('sell'); } else speak('No sell control here.'); return true; }
        if (/close (the )?position|close (the )?trade/.test(t)) { if (has('closePosition')) { call('closePosition'); speak('Closing.'); } else speak('No close-position control here.'); return true; }
        if (/status|how('s| is| are) (things|it|we|trading)|give me an update/.test(t)) { speak(has('getStatus') ? call('getStatus') : 'No status summary is wired up in this bot.'); return true; }
        if (/sound off|stop talking|go silent/.test(t)) { setSound(false); return true; }
        if (/sound on|start talking|speak up/.test(t)) { setSound(true); speak('Sound is back on.'); return true; }
        if (/what can you do|what (controls|commands) do you have/.test(t)) {
            const ad = adapter();
            const caps = ad ? Object.keys(ad).filter(k => typeof ad[k] === 'function') : [];
            speak(caps.length ? ('In this bot I can: ' + caps.join(', ') + '.') : 'This bot hasn\'t told me what I can control yet.');
            return true;
        }
        if (has('listModes') && has('setMode')) {
            const modes = call('listModes') || [];
            for (const m of modes) {
                const re = new RegExp('\\b(switch to|use|go to)\\b.*' + m.toLowerCase().replace(/[^a-z0-9 ]/g, ''));
                if (re.test(t)) { const ok = call('setMode', m); speak(ok ? ('Switched to ' + m + '.') : ('Could not switch to ' + m + '.')); return true; }
            }
        }
        if (has('listRiskSettings') && has('setRiskSetting')) {
            const settings = call('listRiskSettings') || [];
            for (const s of settings) {

function ntInfo(){const n=V.nt,mk=n.venue,fi=FI[mk].get(n.sym),px=n.type==='limit'&&+n.limit>0?+n.limit:livePx(mk,n.sym,0),avail=mk==='f'?S.bal.f.avail:S.bal.s.usdt,mg=+n.margin||0,lev=mk==='f'?+n.lev||1:1,notional=mg*lev,qty=fi&&px?+floorStep(notional/px,fi.step):0;
  const dir=n.side==='LONG'?1:-1,liq=mk==='f'&&px?px*(1-dir*(1/lev-.005)):0,slp=+n.sl>0?px*(1-dir*n.sl/100):0,tpp=+n.tp>0?px*(1+dir*n.tp/100):0;return{fi,px,avail,mg,lev,notional,qty,liq,slp,tpp,fee:notional*.0005*2}}

   ${mk==='f'?`<label class="f"><span>Leverage <b id="ntLevV" class="yel">${n.lev}x</b></span><input type="range" min="1" max="50" value="${n.lev}" data-nt="lev" data-live-out="ntLevV" data-unit="x"></label><div class="row" style="margin-bottom:12px"><span class="k">Margin mode</span><div class="seg"><button class="${n.mt==='ISOLATED'?'on':''}" data-act="ntSet" data-k="mt" data-v="ISOLATED">Isolated</button><button class="${n.mt==='CROSSED'?'on':''}" data-act="ntSet" data-k="mt" data-v="CROSSED">Cross</button></div></div>`:''}
   <div class="two"><label class="f"><span>Stop loss (price %)</span><input type="number" step="any" data-nt="sl" value="${n.sl}" placeholder="e.g. 1.2"></label><label class="f"><span>Take profit (price %)</span><input type="number" step="any" data-nt="tp" value="${n.tp}" placeholder="e.g. 2.4"></label></div>

document.addEventListener('input',e=>{const el=e.target.closest('[data-nt]');if(!el)return;const k=el.dataset.nt;V.nt[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;ntSummary()});
ACT.ntSet=d=>{V.nt[d.k]=d.v;if(d.k==='venue'){V.nt.side='LONG';V.nt.sym=d.v==='s'?(FI.s.has(V.nt.sym)?V.nt.sym:'BTCUSDT'):V.nt.sym;if(d.v==='s'){S.view.needSpot=true;loadExchange('s').then(()=>loadStats('s')).then(()=>K&&refreshSpot().then(()=>ntSummary())).catch(()=>{})}}renderNew()};

ACT.pickPair=()=>{const mk=V.nt.venue;sheet('Choose pair',`<div class="srch">${IC.search}<input type="text" id="pq" placeholder="Search pair (BTC, SOL…)" autocomplete="off"></div><div id="pl"></div>`,()=>{const f=()=>{const q=$('#pq').value.trim().toUpperCase(),l=[...T[mk].values()].filter(x=>!q||x.s.includes(q)).sort((a,b)=>b.q-a.q).slice(0,60);$('#pl').innerHTML=`<table><tbody>${l.map(x=>`<tr data-act="setPair" data-s="${x.s}"><td>${x.s.replace('USDT','')}<span class="mut">/USDT</span></td><td>${fp(x.c)}</td><td><span class="pill ${x.P>=0?'gu':'rd'}">${pct(x.P)}</span></td></tr>`).join('')||'<tr><td class="empty">No match</td></tr>'}</tbody></table>`};$('#pq').oninput=f;f()})};

async function analyzeOne(mk,sym){const [k5,k15]=await Promise.all([klines(mk,sym,'5m',99),klines(mk,sym,'15m',70)]);const sig=analyze(sym,closedOnly(k5),closedOnly(k15));if(sig){sig.mk=mk;if(mk==='s'&&sig.dir<0){sig.ok=false;sig.block='spot is long-only'}S.signals.set(mk+':'+sym,sig)}return sig}

  <div class="card"><div class="row"><div class="seg"><button class="${V.earnMode==='wins'?'on':''}" data-act="eMode" data-v="wins">Wins</button><button class="${V.earnMode==='net'?'on':''}" data-act="eMode" data-v="net">Net</button></div><div class="seg">${[[7,'7D'],[30,'30D'],[0,'ALL']].map(([v,l])=>`<button class="${R===v?'on':''}" data-act="eRange" data-v="${v}">${l}</button>`).join('')}</div></div>
   <div class="note mt8">${V.earnMode==='net'?'Cumulative net profit after fees and funding.':'Cumulative profit from winning days only. Losing days are tracked in Risk Managed and Worst Dip.'}</div><canvas id="eCv" style="height:140px;margin-top:6px"></canvas></div>
  <div class="grid4" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">${g('Total',st.closed+allPositions().length)}${g('Closed',st.closed)}${g('Wins',st.wins,'grn')}${g('Risk Managed',st.risk)}</div>
  <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">${g('Trade Win Rate',st.closed?Math.round(st.winRate)+'%':'—',st.winRate>=50?'grn':'')}${g('Open Now',allPositions().length)}${g('Winning Days',st.winDays)}</div>
  <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">${g('Profit Factor',st.pf?st.pf.toFixed(2):'—')}${g('Worst Dip Survived',st.ddPct.toFixed(1)+'%')}${g('Avg W / L',usd(st.avgW,0)+' / '+usd(st.avgL,0))}</div>
  <div class="card"><div class="two"><div><span class="k">Best trade</span><div class="mt8"><b>${st.best?st.best.sym:'—'}</b><div class="grn">${st.best?usd(st.best.net,2,true):''}</div></div></div><div><span class="k">Toughest day</span><div class="mt8"><b>${st.worstDay&&st.days[st.worstDay].net<0?shortDate(st.worstDay+'T00:00:00Z'):'—'}</b><div class="red">${st.worstDay&&st.days[st.worstDay].net<0?usd(st.days[st.worstDay].net,2,true):''}</div></div></div></div></div>
  <div class="card"><b>TOP PERFORMING PAIRS</b>${st.pairs.length?st.pairs.slice(0,5).map((p,i)=>`<div class="row mt8"><span>#${i+1} <b>${p.sym}</b> <span class="sm">${p.n} trades</span></span><b class="${clsOf(p.net)}">${usd(p.net,2,true)}</b></div>`).join(''):'<div class="note mt8">No closed trades yet.</div>'}</div>
  <div class="card"><b>DAILY BREAKDOWN</b>${st.dk.length?st.dk.slice().reverse().slice(0,40).map(k=>`<div class="row mt8"><span>${shortDate(k+'T00:00:00Z')} <span class="sm">${st.days[k].n}t · ${st.days[k].w}w</span></span><b class="${clsOf(st.days[k].net)}">${money(st.days[k].net,{sign:1})}</b></div>`).join(''):'<div class="note mt8">Daily results appear after your first closed trade.</div>'}<div class="note mt12">Numbers come from your Binance income history (realised P&amp;L, commissions, funding) for the last 90 days, plus spot trades closed here.</div></div>`;
  drawCurve($('#eCv'),pts,V.earnMode==='net'&&st.total<0?'#f6465d':'#0ecb81')}

   <label class="f"><span>Never trade (comma separated)</span><input type="text" data-cfg="blacklist" data-arr="1" value="${esc((cfg.blacklist||[]).join(', '))}" placeholder="optional"></label></div>

  ${full?'':`<div class="card"><b>Entries</b><div class="mt8"></div>${num('minConf','Minimum confidence %',50,95,1,'Higher = fewer, cleaner trades')}${num('maxOpen','Max open trades',1,15,1)}${num('cooldownMin','Cooldown per pair (minutes)',0,240,1,'Doubled after a loss')}${num('maxSpread','Max spread %',.01,1,.01)}${num('minAtr','Min volatility (ATR %)',.05,2,.01)}</div>
  <div class="card"><b>Size &amp; leverage</b><div class="mt8"></div>${num('lev','Leverage (x)',1,125,1,'Megan lowers it per trade if the stop would sit too close to liquidation')}<div class="row" style="margin-bottom:10px"><span class="k">Margin mode</span><div class="seg"><button class="${cfg.margin==='ISOLATED'?'on':''}" data-act="cfgSet" data-k="margin" data-v="ISOLATED">Isolated</button><button class="${cfg.margin==='CROSSED'?'on':''}" data-act="cfgSet" data-k="margin" data-v="CROSSED">Cross</button></div></div>${num('sizePct','Margin per trade (% of free balance)',1,50,1)}</div>
  <div class="card"><b>Exits</b><div class="mt8"></div>${num('slAtr','Stop distance (× ATR)',.5,4,.05)}${num('rr','Target (R multiple)',.8,6,.1)}${swr('runner','Runner mode','No fixed target: profit lock trails the winner')}${num('lockR','Move stop to break-even at (R)',.3,2,.05)}${num('trailGive','Give back at most (fraction of peak)',.1,.8,.05)}${num('staleCandles','Close if no progress after (5m candles)',6,96,1)}</div>`}
  <div class="card"><b>Safety</b><div class="mt8"></div>${num('dailyLoss','Daily loss limit (% of balance)',0,50,.5,'Closes everything and pauses until the next UTC day. 0 = off')}${num('dailyTarget','Daily profit target (%)',0,100,.5,'Stops opening new trades once reached. 0 = off')}
   <div class="note ${risk>3?'warn':''}">Typical risk per trade ≈ <b>${risk.toFixed(2)}%</b> of balance (margin ${E.sizePct}% × ${E.lev}x × ~0.5% stop). ${risk>3?'That is aggressive.':''}</div></div>
  <button class="btn ${S.run?'rs':'gs'} full" data-act="toggleBot">${S.run?'STOP MEGAN':'START MEGAN'}</button><div style="height:10px"></div><button class="btn full" data-act="resetCfg">Reset all settings</button>`}

  if(!S.connected)throw new Error('Not connected to Binance yet: '+(S.err||'check the API Bind page.'));
  if(!cfg.testnet&&!cfg.ack){sheet('Trade with real money?',`<div class="note">Megan will place real leveraged orders on your live Binance account. She cannot guarantee profit and leveraged trading can lose your whole balance. Start on testnet first, use a small amount, and keep the daily loss limit on.</div><label class="row mt12"><span>I understand and accept the risk</span><input type="checkbox" id="ackc"></label><div class="two mt12"><button class="btn" data-act="closeSheet">${t('cancel')}</button><button class="btn y" data-act="ackGo">Start</button></div>`);return}
  startBot()};

let WL=null;
function startBot(){if(RL.on){rpush('/cfg',cfg).then(()=>rpush('/run',{on:true})).then(()=>{S.run=true;refreshAll();toast('Relay is running Megan','ok')}).catch(e=>toast(e.message,'err'));return}S.run=true;LS.set('run',1);log('sys',`MEGAN STARTED on ${cfg.testnet?'TESTNET':'LIVE'} · ${cfg.mode==='full'?'Full Auto ('+cfg.profile+')':'Custom'} · futures ${cfg.futures?'on':'off'} · spot ${cfg.spot?'on':'off'}`,true);keepAwake();scanCycle();refreshAll();toast('Megan is running','ok')}
function stopBot(){if(RL.on){rpush('/run',{on:false}).then(()=>{S.run=false;refreshAll();toast('Megan stopped')}).catch(e=>toast(e.message,'err'));return}S.run=false;LS.set('run',0);log('sys','MEGAN STOPPED. Open trades keep their exchange-side stops. Megan no longer opens or trails trades.',true);try{WL&&WL.release();WL=null}catch(e){}refreshAll();toast('Megan stopped')}
async function keepAwake(){if(!cfg.keepAwake)return;try{if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.run)keepAwake();if(!document.hidden){try{RL.up=Date.now();RL.t=0;rpoll()}catch(_){}refreshAccount()}});

  <div class="card"><b>Transfer USDT</b><div class="note">Moves money between your Spot and Futures wallets on Binance. ${cfg.testnet?'<span class="yel">Not available on testnet.</span>':'The key needs the “Permits Universal Transfer” permission.'}</div>

   <label class="f mt8"><span>Amount (USDT)</span><input type="number" step="any" id="xamt" placeholder="0.00"></label><button class="btn y full" data-act="doXfer" ${cfg.testnet?'disabled':''}>Transfer</button></div>`}

  toast('Checking the key with Binance…','ok');await rfetch('/login',{method:'POST',body:JSON.stringify({k,s:sec,testnet:tn})});
  $('#rlK').value='';$('#rlS').value='';cfg.testnet=tn;if(!tn)cfg.ack=true;LS.set('cfg',cfg);resetMarket();await rlConnect(false)};
ACT.rlLogout=()=>{const n=S.fpos.length;sheet('Log out of this account?',`<div class="note">${n?`You have ${n} open trade(s). Choose what happens to them. Megan stops trading either way.`:'Megan stops trading and the relay forgets this account\'s keys. Its settings are kept for the next time you log in with it.'}</div><div class="col mt12" style="gap:8px">${n?`<button class="btn r" data-act="doRlLogout" data-c="1">Close all trades and log out</button><button class="btn" data-act="doRlLogout" data-c="0">Keep trades open (exchange stops stay) and log out</button>`:`<button class="btn r" data-act="doRlLogout" data-c="0">Log out</button>`}<button class="btn" data-act="closeSheet">Cancel</button></div>`)};
ACT.doRlLogout=async d=>{ACT.closeSheet();await rfetch('/logout',{method:'POST',body:JSON.stringify({closeAll:d.c==='1'})});await rlConnect(true);toast('Logged out. You can log in with another account.','ok')};
ACT.rlOff=()=>{RL.on=false;LS.del('ron');K=null;S.connected=false;S.run=false;toast('Disconnected. The relay keeps trading until you stop Megan or the relay.','ok');renderApi();renderHeader()};
ACT.unbind=()=>{unbind();toast('Key removed from this device','ok');renderApi()};
ACT.unlock=()=>sheet('Unlock API key',`<label class="f"><span>Passphrase</span><input type="password" id="upass" autocomplete="off"></label><button class="btn y full" data-act="doUnlock">Unlock</button>`);
ACT.doUnlock=async()=>{const p=$('#upass').value;let kk;try{kk=await loadKeys(p)}catch(e){throw new Error('Wrong passphrase.')}K=kk;closeSheet();try{await connectAccount();toast('Connected ✓','ok')}catch(e){K=null;throw e}renderApi();renderHeader()};

/* ---------- PROFILE / MORE / INVITE / LOGS / ALERTS / SUPPORT ---------- */
function renderProfile(){const tail=K?K.k.slice(-4):'';
  $('#pg-profile').innerHTML=`<div class="card"><div class="row"><div class="row gap8"><span class="logo" style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f0b90b,#c88f00);display:grid;place-items:center">${LOGO}</span><div class="col"><b style="font-size:15px">Megan Futures</b><span class="note">${K?`API …${esc(tail)}`:'No API key bound'}</span></div></div><span class="chip ${cfg.testnet?'yo':'r'}">${cfg.testnet?'TESTNET':'LIVE'}</span></div>
   <div class="stats4"><div><span class="k">Futures</span><b>${usd(S.bal.f.wallet,0)}</b></div><div><span class="k">Spot</span><b>${usd(S.bal.s.usdt,0)}</b></div><div><span class="k">Mode</span><b>${S.dual?'Hedge':'One-way'}</b></div><div><span class="k">Bot</span><b class="${S.run?'grn':''}">${S.run?'ON':'OFF'}</b></div></div></div>
  <div class="card list">${li('link',t('apiBind'),K?'Connected':'Add or change your key',{a:'go',d:{p:'api'}})}${li('strat',t('strategy'),'Megan settings and risk limits',{a:'go',d:{p:'strategy'}})}${li('wallet',t('assets'),'Balances and transfers',{a:'go',d:{p:'assets'}})}${li('earn',t('earnings'),'Profit history',{a:'go',d:{p:'earnings'}})}${li('globe',t('language'),LANGS[cfg.lang],{a:'lang'})}${li('wallet',t('currency'),cfg.currency,{a:'curSheet'})}</div>
  <div class="card list"><div class="li"><div class="l"><span class="ti">${IC.bell}</span><div class="col"><b>Browser notifications</b><span class="note">Fills, stops and circuit-breaker alerts</span></div></div>${sw(cfg.notify,'toggleNotify')}</div><div class="li"><div class="l"><span class="ti">${IC.sig}</span><div class="col"><b>Sound</b><span class="note">Beep on fills and exits</span></div></div>${sw(cfg.sound,'cfgToggle',{k:'sound'})}</div><div class="li"><div class="l"><span class="ti">${IC.eye}</span><div class="col"><b>Keep screen awake while running</b><span class="note">Megan trades from this page, so it must stay open</span></div></div>${sw(cfg.keepAwake,'cfgToggle',{k:'keepAwake'})}</div></div>
  <div class="card list">${li('dl','Export my data','Journal, income and log as a JSON file',{a:'exportData'})}${li('shield','Risk disclosure','Read before trading with real money',{a:'risk'})}${li('info','About','Build '+BUILD,{a:'about'})}${li('out','Remove key &amp; log out','Deletes the key from this device',{a:'unbind'})}</div>`}
ACT.cfgToggle=ACT.cfgToggle;const _ct=ACT.cfgToggle;ACT.cfgToggle=d=>{_ct(d);if(V.page==='profile')renderProfile()};
ACT.toggleNotify=async()=>{if(cfg.notify){cfg.notify=false}else{try{const r=await Notification.requestPermission();cfg.notify=r==='granted';if(!cfg.notify)toast('Notifications were blocked in the browser','err')}catch(e){toast('Notifications are not supported here','err')}}saveCfg();renderProfile()};
ACT.lang=()=>sheet(t('language'),`<div class="list">${Object.entries(LANGS).map(([k,v])=>`<div class="li" data-act="setLang" data-v="${k}" style="cursor:pointer"><b>${v}</b>${cfg.lang===k?'<span class="yel">✓</span>':''}</div>`).join('')}</div>`);
ACT.setLang=d=>{cfg.lang=d.v;saveCfg();closeSheet();document.documentElement.lang=d.v;go(V.page,{back:1})};
ACT.curSheet=()=>sheet(t('currency'),`<div class="list">${Object.keys(CUR).map(c=>`<div class="li" data-act="setCur" data-v="${c}" style="cursor:pointer"><b>${c}</b>${cfg.currency===c?'<span class="yel">✓</span>':''}</div>`).join('')}</div>`);
ACT.setCur=d=>{cfg.currency=d.v;saveCfg();closeSheet();refreshFx();renderPage(V.page)};
ACT.exportData=()=>{const blob=new Blob([JSON.stringify({build:BUILD,exported:new Date().toISOString(),cfg:Object.assign({},cfg),journal:JOURNAL,income:INC,log:LOG.slice(0,300)},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='megan-futures-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
ACT.risk=()=>sheet('Risk disclosure',`<div class="note" style="font-size:12px;line-height:1.6">Crypto futures are leveraged. You can lose all the money in your account, and faster than you expect. Megan reads candles and applies fixed rules; she cannot see the future and no setting here guarantees profit. Past results, including the ones in this app, do not predict future results.<br><br>Test on Binance testnet first. Use money you can afford to lose. Keep the daily loss limit on. Never enable withdrawals on the API key.<br><br>This is software you run yourself: keys and trades stay on your device. Binance fees and funding are real costs and the app shows them in Earnings.</div>`);
ACT.about=()=>sheet('About',`<div class="note" style="font-size:12px;line-height:1.6">Megan Futures · build ${BUILD}<br>Talks directly to Binance USDⓈ-M Futures and Spot REST/WebSocket APIs. Conditional (stop / take-profit) orders use Binance's Algo Order endpoint, with the classic order endpoint as fallback.<br>Environment: ${cfg.testnet?'testnet':'live'} · position mode: ${S.dual?'hedge':'one-way'}.</div>`);
function renderMore(){$('#pg-more').innerHTML=`<div class="card list">${li('log','Megan live feed','Every decision she makes',{a:'go',d:{p:'logs'}})}${li('bell','Alerts','Fills, stops, circuit breaker',{a:'go',d:{p:'alerts'}})}${li('cup',t('leaderboard'),'Your pairs ranked',{a:'go',d:{p:'leaderboard'}})}${li('inv',t('invite'),'Share the app',{a:'go',d:{p:'invite'}})}${li('head','Support','Help, diagnostics, connection test',{a:'support'})}${li('shield','Risk disclosure','',{a:'risk'})}${li('info','About','',{a:'about'})}</div>`}
function renderInvite(){const url=location.href.split('#')[0];$('#pg-invite').innerHTML=`<div class="card"><b>Invite a friend</b><div class="note mt8">Share this app. It runs on their own device with their own Binance key, so there is no referral account and nothing is tracked.</div><label class="f mt12"><span>Link</span><input type="text" readonly value="${esc(url)}"></label><div class="two"><button class="btn" data-act="copy" data-v="${esc(url)}">${IC.copy} Copy link</button><button class="btn y" data-act="shareApp">${IC.share} Share</button></div></div>`}
ACT.shareApp=async()=>{const url=location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:'Megan Futures',text:'Megan Futures: AI crypto trading app for Binance',url});else{await navigator.clipboard.writeText(url);toast('Link copied','ok')}}catch(e){}};
let logFilter='all';
function renderLogs(){const l=LOG.filter(x=>logFilter==='all'||(logFilter==='trades'?['bet','win','loss'].includes(x.k):x.k==='err'||x.k==='warn'));
  $('#pg-logs').innerHTML=`<div class="row gap8" style="margin-bottom:10px">${[['all','All'],['trades','Trades'],['err','Problems']].map(([v,t2])=>`<button class="chip ${logFilter===v?'y':''}" data-act="logF" data-v="${v}">${t2}</button>`).join('')}</div><div class="card">${l.length?l.slice(0,150).map(x=>`<div class="logl"><time>${hhmm(x.t)}</time><b class="${x.k}">${x.k.toUpperCase()}</b><span>${esc(x.m)}</span></div>`).join(''):'<div class="empty">Nothing yet.</div>'}</div>`}
ACT.logF=d=>{logFilter=d.v;renderLogs()};
function renderAlerts(){UNREAD=0;LS.set('unread',0);renderHeader();$('#pg-alerts').innerHTML=`<div class="card">${ALERTS.length?ALERTS.map(x=>`<div class="logl"><time>${hhmm(x.t)}</time><b class="${x.k}">${x.k.toUpperCase()}</b><span>${esc(x.m)}</span></div>`).join(''):'<div class="empty">No alerts yet.</div>'}</div>`}
ACT.support=()=>sheet('Support',`<div class="note" style="font-size:12px;line-height:1.55"><b>Orders are refused?</b> Check the key has Futures permission and, if IP-restricted, your current IP is whitelisted.<br><b>“Could not reach Binance”?</b> A VPN, region block or ad-blocker is stopping the request.<br><b>Nothing trades?</b> Open Signals: each pair shows why Megan is waiting. Check the daily loss limit and max open trades.<br><b>Closed the app?</b> Megan only trails stops while this page is open. The stop already on Binance still protects the position.</div><div class="col mt12" style="gap:8px"><button class="btn" data-act="connTest">Run connection test</button><button class="btn" data-act="copyDiag">Copy diagnostics</button></div><div id="diagOut" class="note mt8"></div>`);
ACT.connTest=async()=>{const o=$('#diagOut');o.textContent='Testing…';const r=[];try{const t0=now();await req('f','GET','/fapi/v1/ping');r.push(`Binance ${cfg.testnet?'testnet':'live'} reachable (${now()-t0}ms)`)}catch(e){r.push('Binance unreachable: '+friendly(e))}
  if(K){try{await F('GET','/fapi/v1/positionSide/dual',{},1);r.push('API key accepted')}catch(e){r.push('API key problem: '+friendly(e))}}else r.push('No key bound');r.push('Request weight used this minute: '+W.used);o.innerHTML=r.map(esc).join('<br>')};
ACT.copyDiag=()=>ACT.copy({v:JSON.stringify({build:BUILD,env:cfg.testnet?'testnet':'live',bound:!!K,connected:S.connected,err:S.err,run:S.run,halt:S.halt,dual:S.dual,open:S.fpos.length,pairs:S.signals.size,scan:S.scan,weight:W.used,ua:navigator.userAgent},null,1)});

/* ---------- registry, events, boot ---------- */
const RENDER={home:renderHome,trades:()=>renderTrades(1),new:renderNew,market:renderMarket,profile:renderProfile,signals:renderSignals,earnings:renderEarnings,leaderboard:renderLeader,strategy:renderStrategy,assets:renderAssets,invite:renderInvite,api:renderApi,more:renderMore,logs:renderLogs,alerts:renderAlerts};
const NO_AUTO=['strategy','new','api','market'];
function safeRender(){if(now()-V.touch<900||$('#sheet').classList.contains('on'))return;const p=V.page;if(p==='trades')return renderTrades();if(NO_AUTO.includes(p)){if(p==='market'&&now()-(V._m||0)>5000){V._m=now();fillMarket()}return}if(RENDER[p])RENDER[p]()}
UI.accountChanged=()=>{renderHeader();if(V.page==='new')ntSummary()};UI.scanDone=()=>{};UI.incomeChanged=()=>{invStats();safeRender()};UI.logChanged=()=>{if(V.page==='logs')safeRender();if(!['new','strategy','api'].includes(V.page)&&now()-(V._l||0)>1500){V._l=now();}};
UI.visibleSyms=()=>{const o=[];if(PAIR&&SHEET_CTX==='pair')o.push({mk:PAIR.mk,sym:PAIR.sym});if(V.page==='market')marketRows().slice(0,15).forEach(x=>o.push({mk:V.mktTab,sym:x.s}));if(V.page==='home')[...T[V.venue].values()].filter(x=>x.q>=(V.venue==='f'?2e7:1e7)).sort((a,b)=>b.q-a.q).slice(0,10).forEach(x=>o.push({mk:V.venue,sym:x.s}));if(V.page==='new'&&V.nt.sym)o.push({mk:V.nt.venue,sym:V.nt.sym});return o};
function resetMarket(){FI.f=new Map();FI.s=new Map();T.f=new Map();T.s=new Map();S.signals.clear();KCACHE.f.clear();KCACHE.s.clear();S.statsAt={};INC=[];LS.del('inc');invStats();LIVE.f.reset();LIVE.s.reset();bootMarket()}
async function bootMarket(){try{await loadExchange('f');await loadStats('f');scanCycle();if(V.page==='home')renderHome()}catch(e){if(now()-S.lastNote>20000){S.lastNote=now();log('warn','Market data: '+friendly(e))}}}
async function refreshAll(){renderHeader();safeRender()}
function init(){
  document.documentElement.lang=cfg.lang;LIVE.f.connect();bootMarket();refreshFx();
  const kv=LS.get('keys',null);if(LS.get('ron',0)){rlConnect(true)}else if(kv&&!kv.enc){K={k:kv.k,s:kv.s};connectAccount().then(()=>{if(LS.get('run',0)&&cfg.ack!==undefined&&(cfg.testnet||cfg.ack)){S.run=true;keepAwake();log('sys','Megan resumed after reload.',true)}go(V.page,{back:1})}).catch(e=>{S.err=friendly(e);log('err','Auto-connect failed: '+friendly(e));renderHeader()})}
  setInterval(()=>{if(K&&!document.hidden)refreshAccount()},5000);
  setInterval(()=>{if(K&&S.connected&&!document.hidden)syncIncome()},90000);
  setInterval(()=>{if(FI.f.size&&!document.hidden&&(!RL.on||now()-_scT>90000)){_scT=now();scanCycle()}},4000);
  setInterval(()=>{if(!K||!S.connected)return;try{manage();riskGuard()}catch(e){console.error(e)}},1000);
  setInterval(()=>{if(S.run)decide()},1500);
  setInterval(()=>{try{megan.narrate()}catch(e){}},15000);
  setInterval(()=>{if(now()-(S.statsAt.f||0)>60000&&FI.f.size)loadStats('f').catch(()=>{});if(S.view.needSpot&&now()-(S.statsAt.s||0)>60000&&FI.s.size)loadStats('s').catch(()=>{})},15000);
  setInterval(syncLive,4000);setInterval(rpoll,3000);
  setInterval(()=>{if(SHEET_CTX==='pair'){pairPaint(true)}safeRender();renderHeader();try{syncLive()}catch(e){}},2500);
  setInterval(()=>{try{liveTrades()}catch(e){}},400);
  go('home');
  if(kv&&kv.enc)setTimeout(()=>{toast('Encrypted key found: unlock it on the API Bind page')},800)}
window.addEventListener('error',e=>{try{log('err','Script error: '+e.message)}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{if(e.reason&&e.reason.code!==undefined)return;log('err','Unhandled: '+(e.reason&&e.reason.message||e.reason))}catch(_){}});
init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
