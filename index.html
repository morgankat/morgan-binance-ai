<script>
'use strict';
/* ============ MEGAN FUTURES — core: utils, config, i18n, icons, sheets, logs ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const LS={get(k,d){try{const v=localStorage.getItem('mf_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mf_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('mf_'+k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const now=()=>Date.now();
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sum=a=>a.reduce((s,x)=>s+x,0);
const dec=step=>{const s=String(+step);if(s.indexOf('e-')>0)return parseInt(s.split('e-')[1],10);const i=s.indexOf('.');return i<0?0:s.length-i-1};
const floorStep=(x,step)=>(Math.floor(x/step+1e-9)*step).toFixed(dec(step));
const roundTick=(x,tick)=>(Math.round(x/tick)*tick).toFixed(dec(tick));
function fp(p){if(p==null||isNaN(p))return '—';p=+p;const a=Math.abs(p);const d=a>=1000?2:a>=10?3:a>=1?4:a>=.1?5:a>=.01?6:7;return p.toFixed(d)}
const pct=(x,d=2)=>(x>=0?'+':'')+(+x).toFixed(d)+'%';
function compact(n){const a=Math.abs(n),s=n<0?'-':'';if(a>=1e12)return s+(a/1e12).toFixed(2)+'T';if(a>=1e9)return s+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+(a/1e6).toFixed(a>=1e8?0:1)+'M';if(a>=1e3)return s+(a/1e3).toFixed(a>=1e5?0:1)+'K';return s+a.toFixed(2)}
const dayKey=t=>new Date(t).toISOString().slice(0,10);
const hhmm=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const shortDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const BUILD='MF-'+'2026.11.01-bank4';
/* ---------- Termux relay client: keys + Megan engine live on the phone's relay, app is the dashboard ---------- */
let _scT=0;const RL={on:false,url:LS.get('rurl','http://127.0.0.1:8787'),tok:LS.get('rtok',''),seq:0,err:'',info:null,t:0,up:0};
async function rfetch(path,opt){const r=await fetch(RL.url+path,Object.assign({headers:{'Content-Type':'application/json','X-Relay-Token':RL.tok}},opt));const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.error)||'Relay error '+r.status);return j}
const rpush=(p,b)=>rfetch(p,{method:'POST',body:JSON.stringify(b)});
async function relayReq(mk,method,path,params,mode){let j;try{j=await rpush('/p',{mk,method,path,params,mode})}catch(e){throw new ApiErr(0,'Failed to fetch')}if(!j.ok)throw new ApiErr(j.code,j.msg);return j.j}
function rapply(h){S.run=h.run;S.halt=h.halt||'';S.dual=h.dual;META=h.meta||{};const js=(h.journal||[]).length+':'+((h.journal||[])[0]||{}).t;if(js!==RL.js){RL.js=js;JOURNAL=h.journal||[];LS.set('journal',JOURNAL);invStats()}RL.up=Date.now();
  (h.log||[]).filter(x=>x.n>RL.seq).reverse().forEach(x=>{RL.seq=Math.max(RL.seq,x.n);log(x.k,x.m,x.a)})}
async function rlConnect(silent){try{const h=await rfetch('/s?since=-1');RL.on=true;RL.info=h;RL.seq=h.n;RL.err='';LS.set('ron',1);LS.set('rurl',RL.url);LS.set('rtok',RL.tok);K={k:'relay',s:'relay'};
    if(cfg.testnet!==h.testnet){cfg.testnet=h.testnet;LS.set('cfg',cfg);resetMarket()}
    await rpush('/cfg',cfg);await connectAccount();rapply(h);if(!silent)toast('Relay connected ✓','ok');if(V.page==='api')renderApi();renderHeader()}
  catch(e){RL.on=false;if(K&&K.k==='relay')K=null;S.connected=false;RL.err=e.message==='Failed to fetch'?'Cannot reach the relay. Is it running in Termux?':e.message;if(!silent)throw new Error(RL.err);log('warn','Relay: '+RL.err)}}
async function rpoll(){if(!LS.get('ron',0))return;if(!RL.on){if(Date.now()-RL.t>15000){RL.t=Date.now();rlConnect(true)}return}
  try{rapply(await rfetch('/s?since='+RL.seq))}catch(e){if(Date.now()-RL.up>20000){RL.on=false;K=null;S.connected=false;log('err','Relay unreachable. Open trades keep their exchange-side stops.',true);renderHeader()}}}
function relayCard(){return `<div class="card ${RL.on?'g':''}"><div class="row"><div class="col"><b>Termux Relay${RL.on?' · connected':''}</b><span class="note">${RL.on?`Megan runs on your phone in Termux and keeps trading when this app is closed. Keys live on the relay only · ${RL.info&&RL.info.testnet?'TESTNET':'<b class="red">LIVE</b>'}`:`In Termux run <b>python binance_relay.py</b>, then paste the token it prints.${RL.err?' <span class="red">'+esc(RL.err)+'</span>':''}`}</span></div>${RL.on?`<button class="btn r sm2" data-act="rlOff">Disconnect</button>`:''}</div>${RL.on?'':`<label class="f mt8"><span>Relay address</span><input id="rlU" value="${esc(RL.url)}"></label><label class="f"><span>Relay token</span><input id="rlT" type="password" value="${esc(RL.tok)}"></label><button class="btn y full" data-act="rlConnect">Connect relay</button>`}</div>`}

/* ---------- live chart: drag to scroll, pinch / wheel / ± to zoom, ⏭ to jump to the latest candle ---------- */
class LiveChart{
 constructor(sym,iv,h,bar){Object.assign(this,{mk:'f',sym,iv,h,B:[],vis:70,off:0,lines:[],ws:null,gen:0,P:new Map(),temp:false});
  const w=this.el=document.createElement('div');
  w.innerHTML=(bar?'<div class="row gap8" style="margin-bottom:6px"><select class="lcs" style="width:auto;padding:4px 6px;background:var(--bg2);border:1px solid var(--line);border-radius:8px"></select><div class="seg lci"></div><span style="flex:1"></span><button class="chip lcm">−</button><button class="chip lcp">+</button><button class="chip y lcl">⏭</button></div>':'')+`<canvas style="width:100%;height:${h}px;display:block;touch-action:pan-y"></canvas>`;
  const cv=this.cv=w.querySelector('canvas');
  if(bar){this.sel=w.querySelector('.lcs');this.sel.onchange=()=>{this.sym=this.sel.value;this.load()};const bi=w.querySelector('.lci');bi.innerHTML=['1m','5m','15m','1h'].map(i=>`<button data-i="${i}">${i}</button>`).join('');bi.onclick=e=>{const i=e.target.dataset.i;if(i){this.iv=i;this.load();this.tabs()}};
   w.querySelector('.lcm').onclick=()=>this.zoom(1.3);w.querySelector('.lcp').onclick=()=>this.zoom(1/1.3);w.querySelector('.lcl').onclick=()=>{this.off=0;this.draw()}}
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);this.P.set(e.pointerId,e.clientX);this.d0=null};
  cv.onpointermove=e=>{if(!this.P.has(e.pointerId))return;const px=this.P.get(e.pointerId);this.P.set(e.pointerId,e.clientX);
   if(this.P.size===2){const [a,b]=[...this.P.values()],d=Math.abs(a-b);if(this.d0&&d>8)this.zoom(this.d0/d);this.d0=d}else{this.off+=(e.clientX-px)/this.cw();this.draw()}};
  cv.onpointerup=cv.onpointercancel=e=>{this.P.delete(e.pointerId);this.d0=null};
  cv.onwheel=e=>{e.preventDefault();this.zoom(e.deltaY>0?1.12:1/1.12)};cv.ondblclick=()=>{this.off=0;this.vis=70;this.draw()};

/* mode: 0 public, 1 signed, 2 api-key header only */
async function req(mk,method,path,params={},mode=0){
  if(RL.on&&mode)return relayReq(mk,method,path,params,mode);
  if(now()<W.until)throw new ApiErr(-1003,'Binance rate limit: pausing requests for '+Math.ceil((W.until-now())/1000)+'s');
  const q=[];for(const k in params){const v=params[k];if(v!==undefined&&v!==null)q.push(k+'='+encodeURIComponent(String(v)))}
  const headers={};
  if(mode){if(!K)throw new ApiErr(-2015,'No API key bound yet. Open API Bind first.');headers['X-MBX-APIKEY']=K.k}
  if(mode===1){q.push('recvWindow=10000','timestamp='+(now()+W.offset));const qs=q.join('&');q.push('signature='+await hmac(K.s,qs))}
  const url=ENV()[mk]+path+(q.length?'?'+q.join('&'):'');
  let res;try{res=await fetch(url,{method,headers})}catch(e){throw new ApiErr(0,'Failed to fetch')}
  const u=res.headers.get('x-mbx-used-weight-1m');if(u)W.used=+u;
  let j=null;try{j=await res.json()}catch(e){}

/* ---------- live prices: one small websocket per market for symbols we care about ---------- */
class Live{constructor(mk){this.mk=mk;this.subs=new Set();this.ws=null;this.tries=0;this.want=new Set();this.id=1}
  connect(){if(this.ws)return;let ws;try{ws=new WebSocket(ENV()['w'+this.mk]+'/ws')}catch(e){return this.retry()}this.ws=ws;
    ws.onopen=()=>{this.tries=0;this.subs=new Set();this.sync(this.want)};
    ws.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m&&m.e==='24hrMiniTicker'){const t=T[this.mk].get(m.s);if(t){t.c=+m.c;t.live=now();t.h=Math.max(t.h,+m.h);t.l=Math.min(t.l||1e18,+m.l);t.P=t.o?(t.c-t.o)/t.o*100:t.P}}}catch(e){}};
    ws.onclose=()=>{this.ws=null;this.retry()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
  retry(){this.tries++;clearTimeout(this.rt);this.rt=setTimeout(()=>this.connect(),Math.min(15000,1000*this.tries))}
  sync(want){this.want=new Set(want);if(!this.ws||this.ws.readyState!==1)return;
    const add=[...this.want].filter(s=>!this.subs.has(s)),del=[...this.subs].filter(s=>!this.want.has(s));
    const send=(method,arr)=>{for(let i=0;i<arr.length;i+=30)this.ws.send(JSON.stringify({method,params:arr.slice(i,i+30).map(s=>s.toLowerCase()+'@miniTicker'),id:this.id++}))};
    if(add.length){send('SUBSCRIBE',add);add.forEach(s=>this.subs.add(s))}if(del.length){send('UNSUBSCRIBE',del);del.forEach(s=>this.subs.delete(s))}}
  reset(){clearTimeout(this.rt);try{this.ws&&this.ws.close()}catch(e){}this.ws=null;this.subs=new Set();this.tries=0;this.connect()}}

function rsiCalc(c,n=14){if(c.length<n+2)return 50;let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>=0?g+=d:l-=d}g/=n;l/=n;for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+(d>0?d:0))/n;l=(l*(n-1)+(d<0?-d:0))/n}return l===0?100:100-100/(1+g/l)}

/* ---- the 6 hand-drawn candle patterns (closed candles only). Same rules as the Candle Detector in the forex bot ---- */
const CDN={1:'big bull, small bull, then a big bear',2:'rejection candle with a long upper wick',3:'morning star (big bear, small candle, big bull)',4:'big bull, bear, then a weak bounce that fails',5:'bear flag (big bear, small pause, big bear)',6:'recovery, then a small dip'};

function cdDetect(B,e){if(e<16||!B[e])return null;const at=cdAtr(B,e);if(!(at>0))return null;

  if(big(R)&&be(R)&&bu(Q)&&bd(Q)>=.3*at&&bu(P)&&bd(P)>=.3*at&&P.c>Q.c&&be(A)&&bd(A)<=.6*bd(P)&&bd(A)<=.5*at&&A.c>=P.o)return mk(6,'BUY',4);
  if(big(Q)&&bu(Q)&&bd(P)<=.6*bd(Q)&&P.c>=P.o-.05*at&&P.c>=Q.c-.3*bd(Q)&&big(A)&&be(A)&&bd(A)>=.6*bd(Q)&&A.c<=Q.c-.5*bd(Q))return mk(1,'SELL',3);
  if(big(Q)&&be(Q)&&bd(P)<=.6*bd(Q)&&md(P)<=md(Q)&&P.c<=Q.c+.3*bd(Q)&&big(A)&&bu(A)&&bd(A)>=.6*bd(Q)&&A.c>=Q.c+.5*bd(Q))return mk(3,'BUY',3);
  if(big(Q)&&bu(Q)&&be(P)&&bd(P)>=.35*at&&P.c<=md(Q)&&bu(A)&&bd(A)<=.6*bd(P)&&A.c<P.o)return mk(4,'SELL',3);
  if(be(A)&&rg(A)>=.8*at&&bd(A)<=.3*rg(A)&&(A.h-Math.max(A.o,A.c))>=.6*rg(A)&&(Math.min(A.o,A.c)-A.l)<=.12*rg(A)&&A.h>=Math.max(P.h,Q.h,R.h))return mk(2,'SELL',1);
  return null}

/* ---- confirmed candle structure: higher-high/higher-low vs lower-high/lower-low, closed candles only ---- */
function structInfo(B,atr){const n=B.length-1,o={dir:0,clear:false,shift:0,two:0,H2:null,L2:null};if(n<14)return o;
  const H=[],L=[];for(let i=Math.max(2,n-70);i<=n-3;i++){const x=B[i];if(x.h>B[i-1].h&&x.h>B[i-2].h&&x.h>B[i+1].h&&x.h>B[i+2].h)H.push(x.h);if(x.l<B[i-1].l&&x.l<B[i-2].l&&x.l<B[i+1].l&&x.l<B[i+2].l)L.push(x.l)}
  const c1=B[n],c2=B[n-1];o.two=(c1.c>c1.o&&c2.c>c2.o)?1:(c1.c<c1.o&&c2.c<c2.o)?-1:0;
  if(H.length>=2&&L.length>=2){const H1=H[H.length-2],L1=L[L.length-2];o.H2=H[H.length-1];o.L2=L[L.length-1];
    if(o.H2>H1&&o.L2>L1){o.dir=1;o.clear=true}else if(o.H2<H1&&o.L2<L1){o.dir=-1;o.clear=true}
    const up=c1.c>o.H2+.1*atr&&c1.c>c1.o,dn=c1.c<o.L2-.1*atr&&c1.c<c1.o;
    if(up&&!dn&&o.dir!==1){o.dir=1;o.clear=false;o.shift=1}else if(dn&&!up&&o.dir!==-1){o.dir=-1;o.clear=false;o.shift=-1}}
  return o}

function evalExit(m,dir,price,E){

  if(!m.runner&&m.tp&&(price-m.tp)*dir>=0)return{close:'Take profit'};

function posCard(p){const k=mkey(p),L=p.side==='LONG',c=clsOf(p.roe),ex=V.expanded.has(k),m=p.meta||{},held=m.openedAt?Math.round((now()-m.openedAt)/6e4):null;

   <button class="ibtn" data-act="sharePos" data-k="${k}">${IC.share}</button><button class="ibtn" data-act="closePos" data-k="${k}">${IC.x}</button><button class="ibtn" data-act="togglePos" data-k="${k}">${IC.chev}</button></div>
   <div class="row mt8"><span class="pnl ${c}" data-lv="${k}|pnl">${usd(p.upnl,2,true)}</span><span class="${c}" style="font-weight:700" data-lv="${k}|roe">${pct(p.roe)} ROE</span></div>
   <div class="kv"><div><span>Size</span><b>${usd(p.notional)}</b></div><div><span>Margin</span><b>${usd(p.margin)}</b></div><div><span>Entry</span><b>${fp(p.entry)}</b></div><div><span>Mark</span><b data-lv="${k}|mark">${fp(p.price)}</b></div><div><span>Stop</span><b>${m.sl?fp(m.sl):'—'}</b></div><div><span>${m.runner?'Exit':'Target'}</span><b>${m.runner?'trail':m.tp?fp(m.tp):'—'}</b></div></div>
   <div class="more"><div class="kvl"><div><span>Liq. price</span><b>${p.liq>0?fp(p.liq):'—'}</b></div><div><span>Margin mode</span><b>${p.mt}</b></div><div><span>Strategy</span><b>${esc(m.strat||'Manual')}${m.conf?' '+m.conf+'%':''}</b></div><div><span>Open for</span><b>${held==null?'—':held>=60?Math.floor(held/60)+'h '+held%60+'m':held+'m'}</b></div></div>
   ${m.why?`<div class="note mt8">${esc(m.why)}</div>`:''}
   <div class="row gap8 mt12" style="flex-wrap:wrap">${p.venue==='f'?`<button class="btn sm2" data-act="levPos" data-k="${k}">Leverage</button>`:''}<button class="btn sm2" data-act="tpslPos" data-k="${k}">TP/SL</button><button class="btn sm2" data-act="autoPos" data-k="${k}">${p.auto?'Take over':'Hand to Megan'}</button><button class="btn sm2" data-act="pair" data-mk="${p.venue}" data-s="${p.sym}">Chart</button><button class="btn r sm2" data-act="closePos" data-k="${k}">${t('close')}</button></div></div></div>`}
function closedCard(x){const c=clsOf(x.net);return `<div class="tcard"><div class="hd"><span class="sym">${x.sym}</span><span class="chip">${x.venue==='s'?'SPOT':'FUTURES'}</span><span style="flex:1"></span><span class="sm">${new Date(x.t1).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div><div class="row mt8"><span class="pnl ${c}">${usd(x.net,2,true)}</span><span class="sm">gross ${usd(x.pnl,2,true)} · fees ${usd(x.fees,2)}</span></div></div>`}
function tradesSig(){const ap=filteredPos();return [V.tradeFilter,V.tradeTab,ap.map(p=>mkey(p)+(V.expanded.has(mkey(p))?'+':'')+(p.meta&&p.meta.sl?Math.round(p.meta.sl*1e6):'')+(p.auto?'a':'m')).join(','),stats(30).closed].join('|')}
const filteredPos=()=>allPositions().filter(p=>V.tradeFilter==='all'||(V.tradeFilter==='f'&&p.venue==='f')||(V.tradeFilter==='s'&&p.venue==='s'));
let lastTSig='';
function renderTrades(force){const sig=tradesSig();if(!force&&sig===lastTSig)return liveTrades();lastTSig=sig;
  const ap=filteredPos(),cl=stats(30).trades.filter(x=>V.tradeFilter==='all'||(V.tradeFilter==='f'&&x.venue==='f')||(V.tradeFilter==='s'&&x.venue==='s')).slice(0,60);
  $('#pg-trades').innerHTML=`<div class="row" style="margin-bottom:10px"><div class="seg">${[['all','all'],['f','futures'],['s','spot']].map(([v,l])=>`<button class="${V.tradeFilter===v?'on':''}" data-act="tfilter" data-v="${v}">${t(l)}</button>`).join('')}</div><button class="btn g sm2" data-act="go" data-p="new">+ ${t('newTrade')}</button></div>
  <div class="mtabs"><button class="${V.tradeTab==='open'?'on':''}" data-act="ttab" data-v="open">${t('open')} ${ap.length}</button><button class="${V.tradeTab==='closed'?'on':''}" data-act="ttab" data-v="closed">${t('closed')} ${cl.length}</button></div>
  ${V.tradeTab==='open'?`${ap.length?`<div class="card" style="padding:10px"><div class="row"><div class="col"><span class="k">Total floating P&amp;L</span><b class="${clsOf(sum(ap.map(p=>p.upnl)))}" style="font-size:18px" data-lv="tot|pnl">${usd(sum(ap.map(p=>p.upnl)),2,true)}</b></div><div class="row gap8"><button class="btn g sm2" data-act="closeWin">Close winners</button><button class="btn sm2" data-act="closeByPnl">By P&amp;L</button><button class="btn r sm2" data-act="closeAll">${t('closeAll')}</button></div></div></div>`:''}${ap.length?ap.map(posCard).join(''):`<div class="empty">No open trades.<br>${S.run?'Megan is watching for a confirmed setup.':'Start the bot or open a manual trade.'}</div>`}`:
   (cl.length?`<div class="row" style="margin-bottom:8px"><span class="note">${cl.length} closed trades</span><button class="btn r sm2" data-act="clearHist">Clear history</button></div>`+cl.map(closedCard).join(''):`<div class="empty">No closed trades in the last 30 days yet.</div>`)}`}
function liveTrades(){const ap=filteredPos();let tot=0;ap.forEach(p=>{const k=mkey(p);tot+=p.upnl;$$(`[data-lv="${k}|pnl"]`).forEach(e=>{e.textContent=usd(p.upnl,2,true);e.className='pnl '+clsOf(p.roe)});$$(`[data-lv="${k}|roe"]`).forEach(e=>{e.textContent=pct(p.roe)+' ROE';e.className=clsOf(p.roe)});$$(`[data-lv="${k}|mark"]`).forEach(e=>e.textContent=fp(p.price))});const t=$('[data-lv="tot|pnl"]');if(t){t.textContent=usd(tot,2,true);t.className=clsOf(tot)}}
const findPos=k=>allPositions().find(p=>mkey(p)===k);
ACT.tfilter=d=>{V.tradeFilter=d.v;renderTrades(1)};ACT.ttab=d=>{V.tradeTab=d.v;renderTrades(1)};
ACT.togglePos=d=>{V.expanded.has(d.k)?V.expanded.delete(d.k):V.expanded.add(d.k);renderTrades(1)};
ACT.closePos=d=>{const p=findPos(d.k);if(!p)return;sheet('Close '+p.sym,`<div class="note">Close the whole ${p.side} position at market?</div><div class="row mt12"><span>Floating P&amp;L</span><b class="${clsOf(p.upnl)}">${usd(p.upnl,2,true)}</b></div><div class="two mt12"><button class="btn" data-act="closeSheet">${t('cancel')}</button><button class="btn rs" data-act="doClose" data-k="${d.k}">${t('close')}</button></div>`)};

ACT.closeAll=()=>{const ap=filteredPos();if(!ap.length)return;sheet(t('closeAll'),`<div class="note">Close ${ap.length} position(s) at market now?</div><div class="two mt12"><button class="btn" data-act="closeSheet">${t('cancel')}</button><button class="btn rs" data-act="doCloseAll" data-m="all">${t('closeAll')}</button></div>`)};
ACT.closeByPnl=()=>sheet('Close by P&L',`<div class="note">Choose which positions to close at market.</div><div class="col mt12" style="gap:8px"><button class="btn g" data-act="doCloseAll" data-m="win">Close all in profit</button><button class="btn r" data-act="doCloseAll" data-m="loss">Close all in loss</button></div>`);
ACT.closeWin=async()=>{const w=filteredPos().filter(p=>p.upnl>0);if(!w.length)return toast('No positions in profit right now','err');
  let bk={};try{(await req('f','GET','/fapi/v1/ticker/bookTicker',{})).forEach(x=>bk[x.symbol]=x)}catch(e){}
  const net=p=>{const b=bk[p.sym],dir=p.side==='LONG'?1:-1,ex=b?(dir>0?+b.bidPrice:+b.askPrice):(p.price||p.mark);return(ex-p.entry)*p.qty*dir-p.notional*.001};
  const ok=w.filter(p=>net(p)>0),skip=w.length-ok.length;V.winKeys=new Set(ok.map(mkey));
  if(!ok.length)return toast('Their profit would not cover fees and spread right now, so they stay open','err');
  sheet('Close winners',`<div class="note">${ok.length} position(s) stay in profit after fees and spread: about ${usd(sum(ok.map(net)),2,true)} if closed now.${skip?` ${skip} more show a small profit but would close at a loss after costs, so they stay open.`:''} Positions in loss are not touched.</div><div class="two mt12"><button class="btn" data-act="closeSheet">${t('cancel')}</button><button class="btn g" data-act="doCloseWin">Close winners</button></div>`)};
ACT.doCloseWin=async()=>{closeSheet();const ap=filteredPos().filter(p=>V.winKeys&&V.winKeys.has(mkey(p)));const res=await Promise.all(ap.map(p=>closePosition(p,'Closed winners').then(()=>1,e=>{toast(p.sym+': '+friendly(e),'err');return 0})));const n=res.reduce((a,b)=>a+b,0);toast(`Closed ${n} of ${ap.length}`,n?'ok':'err');renderTrades(1)};

ACT.levPos=d=>{const p=findPos(d.k);if(!p)return;sheet('Leverage · '+p.sym,`<label class="f"><span>Leverage <b id="lvv">${p.lev}x</b></span><input type="range" id="lvr" min="1" max="50" value="${p.lev}" data-live-out="lvv" data-unit="x"></label><div class="note">Raising leverage on an open position moves the liquidation price closer. Binance may refuse values above the bracket for your size.</div><button class="btn y full mt12" data-act="doLev" data-k="${d.k}">${t('confirm')}</button>`)};
ACT.doLev=async d=>{const p=findPos(d.k),v=+$('#lvr').value;closeSheet();const r=await setLeverage(p.sym,v);toast('Leverage set to '+r+'x','ok');renderTrades(1)};

ACT.doTpsl=async d=>{const p=findPos(d.k),sl=parseFloat($('#slp').value),tp=parseFloat($('#tpp').value),au=$('#aut').checked,dir=dirOf(p);
  if(sl&&(p.price-sl)*dir<=0)throw new Error('Stop must be on the losing side of the current price.');if(tp&&(tp-p.price)*dir<=0)throw new Error('Target must be on the winning side of the current price.');
  closeSheet();await setProtection(p,{sl:sl||undefined,tp:isNaN(tp)?undefined:tp||0,auto:au});toast('TP/SL saved','ok');renderTrades(1)};

ACT.logF=d=>{logFilter=d.v;renderLogs()};
function renderAlerts(){UNREAD=0;LS.set('unread',0);renderHeader();$('#pg-alerts').innerHTML=`<div class="card">${ALERTS.length?ALERTS.map(x=>`<div class="logl"><time>${hhmm(x.t)}</time><b class="${x.k}">${x.k.toUpperCase()}</b><span>${esc(x.m)}</span></div>`).join(''):'<div class="empty">No alerts yet.</div>'}</div>`}
ACT.support=()=>sheet('Support',`<div class="note" style="font-size:12px;line-height:1.55"><b>Orders are refused?</b> Check the key has Futures permission and, if IP-restricted, your current IP is whitelisted.<br><b>“Could not reach Binance”?</b> A VPN, region block or ad-blocker is stopping the request.<br><b>Nothing trades?</b> Open Signals: each pair shows why Megan is waiting. Check the daily loss limit and max open trades.<br><b>Closed the app?</b> Megan only trails stops while this page is open. The stop already on Binance still protects the position.</div><div class="col mt12" style="gap:8px"><button class="btn" data-act="connTest">Run connection test</button><button class="btn" data-act="copyDiag">Copy diagnostics</button></div><div id="diagOut" class="note mt8"></div>`);
ACT.connTest=async()=>{const o=$('#diagOut');o.textContent='Testing…';const r=[];try{const t0=now();await req('f','GET','/fapi/v1/ping');r.push(`Binance ${cfg.testnet?'testnet':'live'} reachable (${now()-t0}ms)`)}catch(e){r.push('Binance unreachable: '+friendly(e))}
  if(K){try{await F('GET','/fapi/v1/positionSide/dual',{},1);r.push('API key accepted')}catch(e){r.push('API key problem: '+friendly(e))}}else r.push('No key bound');r.push('Request weight used this minute: '+W.used);o.innerHTML=r.map(esc).join('<br>')};
ACT.copyDiag=()=>ACT.copy({v:JSON.stringify({build:BUILD,env:cfg.testnet?'testnet':'live',bound:!!K,connected:S.connected,err:S.err,run:S.run,halt:S.halt,dual:S.dual,open:S.fpos.length,pairs:S.signals.size,scan:S.scan,weight:W.used,ua:navigator.userAgent},null,1)});

/* ---------- registry, events, boot ---------- */
const RENDER={home:renderHome,trades:()=>renderTrades(1),new:renderNew,market:renderMarket,profile:renderProfile,signals:renderSignals,earnings:renderEarnings,leaderboard:renderLeader,strategy:renderStrategy,assets:renderAssets,invite:renderInvite,api:renderApi,more:renderMore,logs:renderLogs,alerts:renderAlerts};
const NO_AUTO=['strategy','new','api','market'];
function safeRender(){if(now()-V.touch<900||$('#sheet').classList.contains('on'))return;const p=V.page;if(p==='trades')return renderTrades();if(NO_AUTO.includes(p)){if(p==='market'&&now()-(V._m||0)>5000){V._m=now();fillMarket()}return}if(RENDER[p])RENDER[p]()}
UI.accountChanged=()=>{renderHeader();if(V.page==='new')ntSummary()};UI.scanDone=()=>{};UI.incomeChanged=()=>{invStats();safeRender()};UI.logChanged=()=>{if(V.page==='logs')safeRender();if(!['new','strategy','api'].includes(V.page)&&now()-(V._l||0)>1500){V._l=now();}};
UI.visibleSyms=()=>{const o=[];if(PAIR&&SHEET_CTX==='pair')o.push({mk:PAIR.mk,sym:PAIR.sym});if(V.page==='market')marketRows().slice(0,15).forEach(x=>o.push({mk:V.mktTab,sym:x.s}));if(V.page==='home')[...T[V.venue].values()].filter(x=>x.q>=(V.venue==='f'?2e7:1e7)).sort((a,b)=>b.q-a.q).slice(0,10).forEach(x=>o.push({mk:V.venue,sym:x.s}));if(V.page==='new'&&V.nt.sym)o.push({mk:V.nt.venue,sym:V.nt.sym});return o};
function resetMarket(){FI.f=new Map();FI.s=new Map();T.f=new Map();T.s=new Map();S.signals.clear();KCACHE.f.clear();KCACHE.s.clear();S.statsAt={};INC=[];LS.del('inc');invStats();LIVE.f.reset();LIVE.s.reset();bootMarket()}
async function bootMarket(){try{await loadExchange('f');await loadStats('f');scanCycle();if(V.page==='home')renderHome()}catch(e){if(now()-S.lastNote>20000){S.lastNote=now();log('warn','Market data: '+friendly(e))}}}
async function refreshAll(){renderHeader();safeRender()}
function init(){
  document.documentElement.lang=cfg.lang;LIVE.f.connect();bootMarket();refreshFx();
  const kv=LS.get('keys',null);if(LS.get('ron',0)){rlConnect(true)}else if(kv&&!kv.enc){K={k:kv.k,s:kv.s};connectAccount().then(()=>{if(LS.get('run',0)&&cfg.ack!==undefined&&(cfg.testnet||cfg.ack)){S.run=true;keepAwake();log('sys','Megan resumed after reload.',true)}go(V.page,{back:1})}).catch(e=>{S.err=friendly(e);log('err','Auto-connect failed: '+friendly(e));renderHeader()})}
  setInterval(()=>{if(K&&!document.hidden)refreshAccount()},5000);
  setInterval(()=>{if(K&&S.connected&&!document.hidden)syncIncome()},90000);
  setInterval(()=>{if(FI.f.size&&!document.hidden&&(!RL.on||now()-_scT>90000)){_scT=now();scanCycle()}},12000);
  setInterval(()=>{if(!K||!S.connected)return;try{manage();riskGuard()}catch(e){console.error(e)}},1000);
  setInterval(()=>{if(S.run)decide()},3000);
  setInterval(()=>{if(now()-(S.statsAt.f||0)>60000&&FI.f.size)loadStats('f').catch(()=>{});if(S.view.needSpot&&now()-(S.statsAt.s||0)>60000&&FI.s.size)loadStats('s').catch(()=>{})},15000);
  setInterval(syncLive,4000);setInterval(rpoll,3000);
  setInterval(()=>{if(SHEET_CTX==='pair'){pairPaint(true)}safeRender();renderHeader()},2500);
  go('home');
  if(kv&&kv.enc)setTimeout(()=>{toast('Encrypted key found: unlock it on the API Bind page')},800)}
window.addEventListener('error',e=>{try{log('err','Script error: '+e.message)}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{if(e.reason&&e.reason.code!==undefined)return;log('err','Unhandled: '+(e.reason&&e.reason.message||e.reason))}catch(_){}});
init();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
